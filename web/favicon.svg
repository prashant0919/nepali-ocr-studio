<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0e223b"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082c54"/>
      <stop offset="50%" stop-color="#1197c1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(17, 151, 193, 0.15)" stroke-width="8"/>
  
  <!-- Sleek Scan Grid Lines in background -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="rgba(17, 151, 193, 0.08)" stroke-width="4" stroke-dasharray="16 16"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="rgba(17, 151, 193, 0.08)" stroke-width="4" stroke-dasharray="16 16"/>
  
  <!-- Glowing Peak Triangular Geometry -->
  <g filter="url(#glow)">
    <!-- Mountain Base Backing Shadow -->
    <polygon points="256,96 112,384 400,384" fill="#082c54" opacity="0.4"/>
    
    <!-- Sharp Futuristic Mountain Peak -->
    <polygon points="256,112 128,368 256,368" fill="url(#brand-grad)"/>
    <polygon points="256,112 256,368 384,368" fill="#1197c1" opacity="0.85"/>
    
    <!-- Laser Scan line crossing peak -->
    <line x1="96" y1="280" x2="416" y2="280" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="280" r="10" fill="#ffffff" stroke="#1197c1" stroke-width="4"/>
  </g>
  
  <!-- Floating Digitized Vowels (Shri / Matra hooks) styling at the top -->
  <path d="M 230,190 C 235,170 250,165 256,165 C 265,165 272,175 272,185 C 272,192 265,198 256,202" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
